<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>加拿大 16 天行程</title>

<!-- PWA / Add to Home Screen -->
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#241B3D" />
<link rel="icon" href="favicon.png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="加拿大行程" />
<meta name="mobile-web-app-capable" content="yes" />

<!-- Tailwind (CDN, JIT — no build step needed) -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- Import map: React + lucide-react served as ES modules, no bundler needed -->
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",
    "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
    "lucide-react": "https://esm.sh/lucide-react@0.383.0?external=react"
  }
}
</script>

<style>
  html, body { margin:0; padding:0; background:#FAF8F3; overscroll-behavior-y: none; }
  #root { min-height: 100vh; }
</style>
</head>
<body>
<div id="root">
  <div style="display:flex;align-items:center;justify-content:center;height:100vh;font-family:sans-serif;color:#8A8578;font-size:13px;">
    載入中…
  </div>
</div>

<script type="module">
  import React from "react";
  import { createRoot } from "react-dom/client";
  import App from "./app.js";

  const root = createRoot(document.getElementById("root"));
  root.render(React.createElement(App));

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./sw.js").then((reg) => {
        // Check for a newer sw.js every time the tab becomes active again,
        // not just on first load — catches updates during long-lived sessions.
        document.addEventListener("visibilitychange", () => {
          if (document.visibilityState === "visible") reg.update().catch(() => {});
        });
      }).catch(() => {});

      // When a new service worker takes control (i.e. an update just installed),
      // reload once automatically so the person always sees the latest version
      // without needing to know to hard-refresh.
      let reloaded = false;
      navigator.serviceWorker.addEventListener("controllerchange", () => {
        if (reloaded) return;
        reloaded = true;
        window.location.reload();
      });
    });
  }
</script>
</body>
</html>
